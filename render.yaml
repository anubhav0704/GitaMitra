services:
  # 1. FastAPI Backend Service
  - type: web
    name: gitamitra-backend
    env: python
    region: singapore
    plan: free
    buildCommand: cd backend && pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health/ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: WEB_CONCURRENCY
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: POSTGRES_SERVER
        fromDatabase:
          name: gitamitra-db
          property: host
      - key: POSTGRES_USER
        fromDatabase:
          name: gitamitra-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: gitamitra-db
          property: password
      - key: POSTGRES_DB
        fromDatabase:
          name: gitamitra-db
          property: database
      - key: POSTGRES_PORT
        fromDatabase:
          name: gitamitra-db
          property: port
      - key: EMBEDDING_PROVIDER
        value: local
      - key: RAG_TOP_K
        value: "5"
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "https://gita-mitra.vercel.app,http://localhost:3000"

  # 2. Next.js Frontend Service
  - type: web
    name: gitamitra-frontend
    env: node
    region: singapore
    plan: free
    buildCommand: cd frontend && npm install && npm run build:css && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://gitamitra-backend.onrender.com

databases:
  # 3. Managed PostgreSQL Database
  - name: gitamitra-db
    databaseName: gitamitra
    user: gitamitra
    region: singapore
    plan: free

