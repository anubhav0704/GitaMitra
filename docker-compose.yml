version: '3.8'

services:
  db:
    image: ankane/pgvector:v0.5.1
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-gitamitra}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - POSTGRES_SERVER=db
      - EMBEDDING_PROVIDER=local
      - RAG_TOP_K=5
      - RAG_MIN_SCORE=0.05
      - RAG_SEMANTIC_WEIGHT=0.6
      - RAG_KEYWORD_WEIGHT=0.2
      - RAG_METADATA_WEIGHT=0.2
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-gitamitra}
      - POSTGRES_PORT=5432
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - LLM_MODEL=${LLM_MODEL:-qwen/qwen3.8-27b}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.3}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-1024}
      - CHAT_HISTORY_LIMIT=${CHAT_HISTORY_LIMIT:-6}
      - VOICE_ENABLED=${VOICE_ENABLED:-true}
      - STT_PROVIDER=${STT_PROVIDER:-groq}
      - STT_MODEL=${STT_MODEL:-whisper-large-v3}
      - STT_API_KEY=${STT_API_KEY:-}
      - TTS_PROVIDER=${TTS_PROVIDER:-mock}
      - TTS_MODEL=${TTS_MODEL:-tts-1}
      - TTS_API_KEY=${TTS_API_KEY:-}
      - TTS_VOICE=${TTS_VOICE:-onyx}
      - VOICE_LANGUAGE=${VOICE_LANGUAGE:-auto}
      - VOICE_MAX_DURATION_SECONDS=${VOICE_MAX_DURATION_SECONDS:-60}
      - VOICE_MAX_FILE_SIZE_MB=${VOICE_MAX_FILE_SIZE_MB:-10}
      - VOICE_CACHE_ENABLED=${VOICE_CACHE_ENABLED:-true}
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/package.json:/app/package.json
      - ./frontend/postcss.config.mjs:/app/postcss.config.mjs
      - ./frontend/next.config.ts:/app/next.config.ts
    user: "root"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    command: sh -c "npm run build && npm run start"

volumes:

  postgres_data:
